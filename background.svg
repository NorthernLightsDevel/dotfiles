   <!-- Aurora-like dancing line with curtain-style glow -->
   <defs>
      <!-- Vertical gradient for all curtains -->
      <linearGradient id="aurora-curtain-grad"
         gradientUnits="userSpaceOnUse"
         x1="0" y1="0"
         x2="0" y2="1080">
         <stop offset="0%"   stop-color="#66ffcc" stop-opacity="0.4" />
         <stop offset="40%"  stop-color="#33ff99" stop-opacity="0.25" />
         <stop offset="100%" stop-color="#00ff88" stop-opacity="0" />
      </linearGradient>

      <!-- Blur to soften curtain edges -->
      <filter id="aurora-curtain-blur" x="-40%" y="-40%" width="180%" height="200%">
         <feGaussianBlur stdDeviation="15" />
      </filter>
   </defs>

   <g style="mix-blend-mode:screen;">
