            fill="none"
            stroke="url(#aurora-curtain-grad)"
            stroke-width="80"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity="0.45"
            filter="url(#aurora-curtain-blur)">
            <animate
               attributeName="d"
               dur="18s"
               repeatCount="indefinite"
               calcMode="spline"
               keyTimes="0;0.33;0.66;1"
               keySplines="
